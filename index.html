<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NFC Wanderpokal</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0b0a10">
  <link rel="icon" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">

  <style>
    :root{
      --bg0:#07060a;
      --bg1:#0b0a10;
      --text:#f4f0e6;
      --muted:#c8c1b2;
      --line: rgba(227, 195, 120, 0.25);
      --line2: rgba(227, 195, 120, 0.16);
      --shadow: 0 10px 30px rgba(0,0,0,0.55);
      --glow: 0 0 0 2px rgba(232,197,110,0.10), 0 0 20px rgba(232,197,110,0.08);
    }
    *{ box-sizing:border-box; }
    html, body{ height:100%; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Liberation Sans", sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 700px at 15% 0%, rgba(232,197,110,0.10), transparent 60%),
        radial-gradient(900px 600px at 85% 15%, rgba(246,227,161,0.07), transparent 55%),
        radial-gradient(900px 600px at 50% 110%, rgba(166,124,42,0.08), transparent 55%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
    }
    .wrap{ max-width: 980px; margin: 0 auto; padding: 18px 14px 28px; }
    header{
      position: relative;
      padding: 16px 14px 18px;
      margin: 6px 0 14px;
      border-radius: 14px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.015)),
        radial-gradient(900px 220px at 25% 0%, rgba(246,227,161,0.12), transparent 60%),
        radial-gradient(800px 220px at 85% 30%, rgba(214,177,92,0.10), transparent 55%),
        rgba(0,0,0,0.18);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    header:before{
      content:"";
      position:absolute;
      left: 14px; right: 14px; top: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(246,227,161,0.6), rgba(214,177,92,0.35), transparent);
      opacity: 0.8;
    }
    .headrow{ display:flex; align-items:baseline; justify-content:space-between; gap: 12px; flex-wrap: wrap; }
    h1{
      margin:0;
      font-weight: 820;
      letter-spacing: 0.6px;
      font-size: 28px;
      line-height: 1.05;
      background: linear-gradient(180deg, #f6e3a1, #d6b15c 55%, #a67c2a);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 1px 0 rgba(0,0,0,0.35);
    }
    .pill{
      display:inline-flex;
      align-items:center;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(0,0,0,0.12));
      color: var(--muted);
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
      font-size: 12px;
      white-space: nowrap;
    }
    .panel{
      background:
        radial-gradient(900px 260px at 15% 0%, rgba(246,227,161,0.06), transparent 60%),
        radial-gradient(800px 260px at 85% 0%, rgba(214,177,92,0.05), transparent 55%),
        linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.010)),
        rgba(0,0,0,0.22);
      border: 1px solid var(--line2);
      border-radius: 14px;
      padding: 14px;
      margin: 12px 0;
      box-shadow: 0 10px 28px rgba(0,0,0,0.35);
    }
    .subpanel{
      margin-top: 12px;
      border-radius: 14px;
      border: 1px solid var(--line2);
      background: linear-gradient(180deg, rgba(255,255,255,0.018), rgba(0,0,0,0.18));
      padding: 12px;
    }
    .btnbar{ display:flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    button{
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(0,0,0,0.16));
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      cursor:pointer;
      font-weight: 760;
      letter-spacing: 0.25px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.25);
      transition: transform 0.05s ease, border-color 0.15s ease, filter 0.15s ease;
    }
    button:hover{ border-color: rgba(232,197,110,0.65); filter: brightness(1.05); }
    button:active{ transform: translateY(1px); }
    button.primary{
      border-color: rgba(232,197,110,0.72);
      background:
        linear-gradient(180deg, rgba(246,227,161,0.22), rgba(214,177,92,0.10)),
        linear-gradient(180deg, rgba(255,255,255,0.04), rgba(0,0,0,0.20));
      box-shadow: 0 12px 22px rgba(0,0,0,0.30), 0 0 0 1px rgba(232,197,110,0.12);
    }
    .nfcActions{
      display:flex;
      flex-direction: column;
      align-items:center;
      gap: 10px;
      margin-top: 10px;
    }
    /* Button "Pokal auslesen" an andere Buttons anpassen */
    .btnBig{
      width: 100%;
      padding: 14px 14px;
      font-size: 16px;
      border-radius: 14px;
    }

    .btnFull{
      width: 100%;
      padding: 14px 14px;
      font-size: 16px;
      border-radius: 14px;
    }
    .btnWide{
      width: 100%;
      padding: 14px 14px;
      font-size: 16px;
      border-radius: 14px;
    }
    label{
      display:block;
      font-size: 12px;
      letter-spacing: 0.2px;
      color: var(--muted);
      margin: 0 0 6px;
    }
    textarea, input[type="date"], select, input[type="text"]{
      width: 100%;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.10));
      color: var(--text);
      border-radius: 12px;
      padding: 11px 12px;
      outline: none;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.25);
    }
    textarea{
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 13px;
      line-height: 1.35;
      white-space: pre;
    }
    textarea:focus, input[type="date"]:focus, select:focus, input[type="text"]:focus{
      border-color: rgba(232,197,110,0.65);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.25), var(--glow);
    }
    textarea[readonly]{ opacity: 0.92; }
    .status{
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--line2);
      background: rgba(0,0,0,0.18);
      color: var(--muted);
      font-size: 13px;
    }
    .status.ok{
      border-color: rgba(66,211,155,0.35);
      color: rgba(66,211,155,0.95);
      background: rgba(66,211,155,0.07);
    }
    .status.err{
      border-color: rgba(255,107,107,0.35);
      color: rgba(255,107,107,0.95);
      background: rgba(255,107,107,0.07);
    }
    .status.warn{
      border-color: rgba(232,197,110,0.35);
      color: rgba(246,227,161,0.95);
      background: rgba(232,197,110,0.06);
    }
    .grid2{ display:grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 860px){ .grid2{ grid-template-columns: 1fr 1fr; } }
    .kv{
      display:flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--line2);
      background:
        radial-gradient(700px 140px at 20% 0%, rgba(246,227,161,0.06), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.18));
    }
    table{
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid var(--line2);
      background: rgba(0,0,0,0.14);
    }
    th, td{
      text-align:left;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(227,195,120,0.14);
      font-size: 13px;
    }
    th{
      color: rgba(246,227,161,0.85);
      font-weight: 800;
      background: linear-gradient(180deg, rgba(246,227,161,0.07), rgba(0,0,0,0.10));
      letter-spacing: 0.25px;
    }
    tr:last-child td{ border-bottom: none; }
    .row{ display:flex; gap: 10px; flex-wrap: wrap; align-items: end; }
    .row > .col{ flex: 1 1 240px; min-width: 220px; }
    .hide{ display:none !important; }

    /* Handy: "Web NFC" ausblenden */
    @media (max-width: 700px){
      #webNfcLabel{ display:none !important; }

      #exportText{ display:none !important; }
      label[for="exportText"]{ display:none !important; }
      #afterRead .subpanel .btnbar button{ width: 100%; }
      #exportButtons{ flex-direction: column; }
      #exportButtons button{ width: 100%; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div class="headrow">
        <h1 id="cupName">Wanderpokal</h1>
        <span class="pill" id="cupIdPill">–</span>
      </div>
    </header>

    <section id="topNfcPanel" class="panel hide">
      <div id="webNfcLabel" style="color:var(--muted);font-size:12px;">Web NFC</div>
      <div class="nfcActions" id="nfcActions">
        <button id="btnNfcRead" class="primary btnBig">Pokal auslesen</button>
      </div>
    </section>

    <section id="topManualPanel" class="panel hide">
      <label for="inputText">NFC-Daten einfügen (manuell)</label>
      <textarea id="inputText" spellcheck="false" placeholder="Hier NFC-Text einfügen…"></textarea>
      <div class="btnbar">
        <button class="primary btnFull" id="btnRead">Einlesen</button>
      </div>
      <div id="statusManual" class="status">Web NFC ist nicht verfügbar. Bitte Tag-Inhalt manuell einfügen und „Einlesen“ klicken.</div>
    </section>

    <section id="afterRead" class="panel hide">
      <div class="subpanel">
        <div class="grid2">
          <div class="kv">
            <div style="width:100%;">
              <div id="lastWinnerHeadline" style="font-size:12px;color:var(--muted);">Letzter Gewinner am –</div>
              <div style="font-size:14px; margin-top:6px;">
                <b id="lastWinnerName">–</b>
                <span id="lastWinnerWins" style="color:var(--muted);"></span>
              </div>
            </div>
          </div>
        </div>

        <div class="btnbar" id="topActionButtons">
          <button class="primary" id="btnToggleHistory">Historie anzeigen</button>
          <button class="primary" id="btnToggleMembers">Mitglieder anzeigen</button>
          <button class="primary" id="btnToggleTournament">Neues Turnier erfassen</button>
        </div>
      </div>

      <div id="historyWrap" class="hide">
        <table>
          <thead>
            <tr><th style="width: 140px;">Datum</th><th>Gewinner</th></tr>
          </thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>

      <div id="membersWrap" class="hide">
        <div class="subpanel">
          <div style="font-size:12px;color:var(--muted); margin-bottom:6px;">Mitglieder</div>
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th style="width: 110px;">Siege</th>
                <th style="width: 180px;">Beitritt</th>
              </tr>
            </thead>
            <tbody id="membersBody"></tbody>
          </table>

          <div class="row" style="margin-top:12px;">
            <div class="col">
              <label for="memName">Name</label>
              <input id="memName" type="text" placeholder="Max Mustermann" />
            </div>
            <div class="col">
              <label for="memNick">Spitzname (optional)</label>
              <input id="memNick" type="text" placeholder="Max" />
            </div>
            <div class="col">
              <label for="memJoin">Beitrittsdatum</label>
              <input id="memJoin" type="date" />
            </div>
          </div>

          <div class="btnbar">
            <button class="primary btnWide" id="btnAddMember">Mitglied hinzufügen</button>
          </div>
        </div>
      </div>

      <div id="tournamentWrap" class="hide">
        <div class="subpanel">
          <div class="row">
            <div class="col">
              <label for="datePick">Turnierdatum</label>
              <input id="datePick" type="date" />
            </div>
            <div class="col">
              <label for="playerPick">Gewinner</label>
              <select id="playerPick"></select>
            </div>
          </div>
          <div class="btnbar">
            <button class="primary btnWide" id="btnAddWinner">Gewinner hinzufügen</button>
          </div>
        </div>
      </div>

      <div class="subpanel">
        <label for="exportText">NFC Daten (zum Schreiben)</label>
        <textarea id="exportText" spellcheck="false" readonly></textarea>
        <div class="btnbar" id="exportButtons">
          <button class="primary" id="btnNfcWrite">Pokal aktualisieren</button>
          <button id="btnCopy">In Zwischenablage kopieren</button>
        </div>
      </div>
    </section>

    <!-- Status/Info IMMER unten -->
    <div id="status" class="status" style="margin-top:12px;">
      Tippe auf „Pokal auslesen“ und halte den NFC-Tag an dein Gerät.
    </div>
  </div>

  <script>
    /** @typedef {{id:string, name:string, nick:string, joinDate:string}} Player */
    /** @typedef {{date:string, playerId:string}} Winner */

    const $ = (sel) => document.querySelector(sel);
    const HEADER_PLACEHOLDER = "Wanderpokal";
    const MANUAL_DEFAULT_INFO = "Web NFC ist nicht verfügbar. Bitte Tag-Inhalt manuell einfügen und „Einlesen“ klicken.";

    const els = {
      cupName: $("#cupName"),
      cupIdPill: $("#cupIdPill"),
      topNfcPanel: $("#topNfcPanel"),
      topManualPanel: $("#topManualPanel"),
      inputText: $("#inputText"),
      btnRead: $("#btnRead"),
      statusManual: $("#statusManual"),
      btnNfcRead: $("#btnNfcRead"),
      btnNfcWrite: $("#btnNfcWrite"),
      nfcActions: $("#nfcActions"),
      status: $("#status"),
      afterRead: $("#afterRead"),

      lastWinnerHeadline: $("#lastWinnerHeadline"),
      lastWinnerName: $("#lastWinnerName"),
      lastWinnerWins: $("#lastWinnerWins"),

      btnToggleHistory: $("#btnToggleHistory"),
      historyWrap: $("#historyWrap"),
      historyBody: $("#historyBody"),

      btnToggleMembers: $("#btnToggleMembers"),
      membersWrap: $("#membersWrap"),
      membersBody: $("#membersBody"),
      memName: $("#memName"),
      memNick: $("#memNick"),
      memJoin: $("#memJoin"),
      btnAddMember: $("#btnAddMember"),

      btnToggleTournament: $("#btnToggleTournament"),
      tournamentWrap: $("#tournamentWrap"),
      datePick: $("#datePick"),
      playerPick: $("#playerPick"),
      btnAddWinner: $("#btnAddWinner"),

      exportText: $("#exportText"),
      btnCopy: $("#btnCopy"),
    };

    const state = {
      cupId: null,
      cupName: null,
      /** @type {Player[]} */ players: [],
      /** @type {Winner[]} */ winners: [],
    };

    function setStatus(kind, msg){
      els.status.classList.remove("ok", "err", "warn");
      if (kind) els.status.classList.add(kind);
      els.status.textContent = msg;
    }

    function clearManualErrorUI(){
      if (!els.statusManual) return;
      els.statusManual.classList.remove("err");
      els.statusManual.textContent = MANUAL_DEFAULT_INFO;
    }

    function todayISO(){
      const d = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    }

    function isISODate(s){
      if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
      const [y,m,d] = s.split("-").map(Number);
      const dt = new Date(Date.UTC(y, m-1, d));
      return dt.getUTCFullYear() === y && (dt.getUTCMonth()+1) === m && dt.getUTCDate() === d;
    }

    function formatDE(iso){
      if (!isISODate(iso)) return "–";
      const [y,m,d] = iso.split("-");
      return `${d}.${m}.${y}`;
    }

    function normNewlines(text){
      return text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
    }

    function escapeHtml(s){
      return s.replace(/[&<>"']/g, (c) => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[c]));
    }

    function playerById(id){
      return state.players.find(p => p.id === id) || null;
    }

    function sortWinnersByDateAsc(){
      state.winners.sort((a,b) => a.date.localeCompare(b.date));
    }

    function getLastWinner(){
      if (state.winners.length === 0) return null;
      sortWinnersByDateAsc();
      return state.winners[state.winners.length - 1];
    }

    function displayCupTitle(){
      els.cupName.textContent = state.cupName || HEADER_PLACEHOLDER;
    }

    function renderCupIdPill(){
      els.cupIdPill.textContent = state.cupId ? state.cupId : "–";
    }

    function nextPlayerId(){
      let max = 0;
      for (const p of state.players){
        const m = String(p.id).match(/^P(\d+)$/i);
        if (m) max = Math.max(max, Number(m[1]));
      }
      return "P" + (max + 1);
    }

    function parseNfcText(text){
      const src = normNewlines(text).trim();
      if (!src) throw new Error("Eingabe ist leer.");
      const lines = src.split("\n").map(l => l.trim()).filter(l => l.length > 0);
      if (lines.length < 3) throw new Error("Zu wenige Zeilen. Erwartet Kopfzeile + Sektionen.");

      const header = lines[0].split("|");
      if (header.length < 2) throw new Error("Ungültige Kopfzeile. Erwartet: Pokal-ID|Pokalname");
      const cupId = header[0].trim();
      const cupName = header.slice(1).join("|").trim();
      if (!cupId) throw new Error("Pokal-ID fehlt in Kopfzeile.");
      if (!cupName) throw new Error("Pokalname fehlt in Kopfzeile.");

      let section = null;
      /** @type {Player[]} */ const players = [];
      /** @type {Winner[]} */ const winners = [];

      for (let i = 1; i < lines.length; i++){
        const line = lines[i];

        if (line.toUpperCase() === "[PLAYER]"){ section = "PLAYER"; continue; }
        if (line.toUpperCase() === "[WINNERS]"){ section = "WINNERS"; continue; }
        if (!section) throw new Error(`Unerwartete Zeile vor Sektion: "${line}"`);

        if (section === "PLAYER"){
          const parts = line.split("|");
          if (parts.length < 2) throw new Error(`Ungültige PLAYER-Zeile: "${line}"`);

          const id = (parts[0] || "").trim();
          const name = (parts[1] || "").trim();
          const nick = (parts[2] || "").trim();
          const joinDate = (parts[3] || "").trim();

          if (!id || !name) throw new Error(`PLAYER unvollständig: "${line}"`);
          if (players.some(p => p.id === id)) throw new Error(`Doppelte Spieler-ID: ${id}`);
          if (joinDate && !isISODate(joinDate)) throw new Error(`Ungültiges Beitrittsdatum bei ${id}: "${joinDate}"`);

          players.push({ id, name, nick, joinDate });
          continue;
        }

        if (section === "WINNERS"){
          const m = line.match(/^(\d{4}-\d{2}-\d{2})\s*:\s*([A-Za-z0-9_-]+)$/);
          if (!m) throw new Error(`Ungültige WINNERS-Zeile: "${line}"`);
          const date = m[1];
          const playerId = m[2];
          if (!isISODate(date)) throw new Error(`Ungültiges Datum: "${date}"`);
          winners.push({ date, playerId });
          continue;
        }
      }

      if (players.length === 0) throw new Error("Keine Spieler gefunden (Sektion [PLAYER]).");

      const unknown = winners.filter(w => !players.some(p => p.id === w.playerId));
      if (unknown.length){
        const ids = Array.from(new Set(unknown.map(w => w.playerId))).join(", ");
        throw new Error(`WINNERS enthält unbekannte Spieler-IDs: ${ids}`);
      }

      winners.sort((a,b) => a.date.localeCompare(b.date));
      return { cupId, cupName, players, winners };
    }

    function buildExportText(){
      const header = `${state.cupId}|${state.cupName}`;

      const players = state.players.slice().sort((a,b) => {
        const ma = String(a.id).match(/^P(\d+)$/i);
        const mb = String(b.id).match(/^P(\d+)$/i);
        if (ma && mb) return Number(ma[1]) - Number(mb[1]);
        return String(a.id).localeCompare(String(b.id));
      });

      const playerLines = players.map(p => `${p.id}|${p.name}|${p.nick || ""}|${p.joinDate || ""}`);

      sortWinnersByDateAsc();
      const winnerLines = state.winners.map(w => `${w.date}:${w.playerId}`);

      return [
        header,
        "[PLAYER]",
        ...playerLines,
        "[WINNERS]",
        ...winnerLines
      ].join("\n").trim() + "\n";
    }

    function buildWinCountMap(){
      const winCount = new Map();
      for (const w of state.winners){
        winCount.set(w.playerId, (winCount.get(w.playerId) || 0) + 1);
      }
      return winCount;
    }

    function renderHeader(){
      displayCupTitle();
      renderCupIdPill();
    }

    function updateMenuButtonLabels(){
      const histOpen = !els.historyWrap.classList.contains("hide");
      const memOpen  = !els.membersWrap.classList.contains("hide");

      const tCount = state.winners.length;
      const pCount = state.players.length;

      els.btnToggleHistory.textContent = (histOpen ? "Historie ausblenden" : "Historie anzeigen") + ` (${tCount})`;
      els.btnToggleMembers.textContent = (memOpen ? "Mitglieder ausblenden" : "Mitglieder anzeigen") + ` (${pCount})`;
    }

    function renderPlayersDropdown(){
      els.playerPick.innerHTML = "";
      const frag = document.createDocumentFragment();

      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = "Wer hat gewonnen?";
      placeholder.disabled = true;
      placeholder.selected = true;
      frag.appendChild(placeholder);

      for (const p of state.players){
        const opt = document.createElement("option");
        opt.value = p.id;
        const nick = p.nick ? `(${p.nick})` : "";
        opt.textContent = `${p.name}${nick}`;
        frag.appendChild(opt);
      }

      els.playerPick.appendChild(frag);
    }

    function renderMembersTable(){
      const winCount = buildWinCountMap();
      els.membersBody.innerHTML = "";

      const players = state.players.slice().sort((a,b) => a.name.localeCompare(b.name, "de"));
      for (const p of players){
        const nick = p.nick ? `(${escapeHtml(p.nick)})` : "";
        const wins = winCount.get(p.id) || 0;
        const join = p.joinDate ? escapeHtml(formatDE(p.joinDate)) : "–";

        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${escapeHtml(p.name)}${nick}</td><td>${wins}</td><td>${join}</td>`;
        els.membersBody.appendChild(tr);
      }
    }

    function renderLastWinner(){
      const last = getLastWinner();
      if (!last){
        els.lastWinnerHeadline.textContent = "Letzter Gewinner am –";
        els.lastWinnerName.textContent = "–";
        els.lastWinnerWins.textContent = "";
        return;
      }

      const winCount = buildWinCountMap();
      const p = playerById(last.playerId);

      const displayName = p ? p.name : "Unbekannter Spieler";
      const nick = (p && p.nick) ? `- ${p.nick}` : "";
      const wins = winCount.get(last.playerId) || 0;

      els.lastWinnerHeadline.textContent = `Letzter Gewinner am ${formatDE(last.date)}`;
      els.lastWinnerName.textContent = `${displayName}${nick}`;
      els.lastWinnerWins.textContent = `(${wins} Siege)`;
    }

    function renderHistoryTable(){
      sortWinnersByDateAsc();
      els.historyBody.innerHTML = "";

      if (state.winners.length === 0){
        const tr = document.createElement("tr");
        tr.innerHTML = `<td colspan="2" style="color:var(--muted);">Keine Historie vorhanden.</td>`;
        els.historyBody.appendChild(tr);
        return;
      }

      for (const w of state.winners){
        const p = playerById(w.playerId);
        const name = p
          ? `${escapeHtml(p.name)}${p.nick ? " ("+escapeHtml(p.nick)+")" : ""}`
          : "Unbekannter Spieler";

        const dateDE = escapeHtml(formatDE(w.date));

        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${dateDE}</td><td>${name}</td>`;
        els.historyBody.appendChild(tr);
      }
    }

    function renderExport(){
      els.exportText.value = buildExportText();
    }

    function hideReadButtonOnMobileAfterSuccess(){
      // Nur am Handy ausblenden
      if (window.matchMedia("(max-width: 700px)").matches) {
        if (els.nfcActions) els.nfcActions.classList.add("hide");
      }
    }

    function renderAllAfterRead(){
      els.afterRead.classList.remove("hide");
      els.datePick.value = todayISO();
      els.memJoin.value = todayISO();

      renderHeader();
      renderPlayersDropdown();
      renderMembersTable();
      renderLastWinner();
      renderHistoryTable();
      renderExport();
      updateMenuButtonLabels();
    }

    function applyParsed(parsed){
      state.cupId = parsed.cupId;
      state.cupName = parsed.cupName;
      state.players = parsed.players;
      state.winners = parsed.winners;
    }

    function addMember(){
      const name = (els.memName.value || "").trim();
      const nick = (els.memNick.value || "").trim();
      const join = (els.memJoin.value || "").trim();

      if (!name){
        setStatus("err", "Bitte einen Namen für das Mitglied eingeben.");
        return;
      }
      if (join && !isISODate(join)){
        setStatus("err", "Bitte ein gültiges Beitrittsdatum wählen (oder leer lassen).");
        return;
      }

      const id = nextPlayerId();
      state.players.push({ id, name, nick, joinDate: join });

      renderPlayersDropdown();
      renderMembersTable();
      renderLastWinner();
      renderExport();
      updateMenuButtonLabels();

      els.memName.value = "";
      els.memNick.value = "";
      els.memJoin.value = todayISO();
      setStatus("ok", `Mitglied hinzugefügt: ${name}`);
    }

    function addWinner(){
      const date = (els.datePick.value || "").trim();
      const playerId = els.playerPick.value;

      if (!isISODate(date)){ setStatus("err", "Bitte ein gültiges Turnierdatum auswählen."); return; }
      if (!playerId){ setStatus("err", "Bitte einen Gewinner auswählen."); return; }

      const exists = state.winners.some(w => w.date === date && w.playerId === playerId);
      if (exists){ setStatus("err", "Dieser Gewinner ist für dieses Datum bereits eingetragen."); return; }

      state.winners.push({ date, playerId });
      sortWinnersByDateAsc();

      renderLastWinner();
      renderHistoryTable();
      renderMembersTable();
      renderExport();
      updateMenuButtonLabels();

      setStatus("ok", "Gewinner hinzugefügt.");
      els.playerPick.value = "";
    }

    function readInputManual(){
      try{
        const parsed = parseNfcText(els.inputText.value);
        applyParsed(parsed);
        clearManualErrorUI();
        renderAllAfterRead();
        setStatus("ok", "Pokal erfolgreich ausgelesen.");
        hideReadButtonOnMobileAfterSuccess();
      }catch(err){
        els.afterRead.classList.add("hide");
        state.cupId = null; state.cupName = null;
        renderHeader();
        els.statusManual.classList.add("err");
        els.statusManual.textContent = (err instanceof Error ? err.message : String(err));
        updateMenuButtonLabels();
      }
    }

    async function copyExportToClipboard(){
      const text = (els.exportText.value || "").trim();
      if (!text){ setStatus("err", "Kein Text vorhanden."); return; }

      try{
        if (navigator.clipboard && navigator.clipboard.writeText){
          await navigator.clipboard.writeText(text);
          setStatus("ok", "Text wurde in die Zwischenablage kopiert.");
          return;
        }
      }catch(_e){}

      try{
        els.exportText.focus();
        els.exportText.select();
        const ok = document.execCommand("copy");
        if (ok) setStatus("ok", "Text wurde in die Zwischenablage kopiert.");
        else setStatus("err", "Kopieren nicht erlaubt. Bitte manuell kopieren.");
      }catch(_e){
        setStatus("err", "Kopieren nicht erlaubt. Bitte manuell kopieren.");
      }
    }

    function hasWebNfc(){ return ("NDEFReader" in window); }
    function isSecureContextOk(){ return (location.protocol === "https:" || location.hostname === "localhost"); }

    function updateTopPanels(){
      const nfcOk = hasWebNfc() && isSecureContextOk();
      els.topNfcPanel.classList.toggle("hide", !nfcOk);
      els.topManualPanel.classList.toggle("hide", nfcOk);
    }

    function extractTextFromNdefMessage(message){
      for (const rec of message.records){
        if (rec.recordType === "text" && typeof rec.data === "string") return rec.data;
      }
      for (const rec of message.records){
        const decoded = tryDecodeRecordData(rec);
        if (decoded) return decoded;
      }
      return "";
    }

    function tryDecodeRecordData(rec){
      try{
        if (!rec || !rec.data) return "";
        if (rec.data instanceof DataView) return new TextDecoder("utf-8").decode(rec.data);
        if (rec.data instanceof ArrayBuffer) return new TextDecoder("utf-8").decode(new Uint8Array(rec.data));
        return "";
      }catch(_e){
        return "";
      }
    }

    async function nfcReadOnce(){
      if (!hasWebNfc()){ setStatus("err", "Web NFC ist in diesem Browser nicht verfügbar."); return; }
      if (!isSecureContextOk()){ setStatus("err", "Web NFC erfordert HTTPS (oder localhost)."); return; }

      try{
        const reader = new NDEFReader();
        setStatus("warn", "Bereit zum Lesen… halte den NFC-Tag an dein Gerät.");
        await reader.scan();

        const onReading = (event) => {
          try{
            const text = extractTextFromNdefMessage(event.message);
            if (!text) throw new Error("Kein lesbarer Text-Record gefunden.");

            const parsed = parseNfcText(text);
            applyParsed(parsed);
            clearManualErrorUI();

            setStatus("ok", "Pokal erfolgreich ausgelesen.");
            renderAllAfterRead();
            hideReadButtonOnMobileAfterSuccess();
          }catch(e){
            setStatus("err", e instanceof Error ? e.message : String(e));
          }finally{
            reader.removeEventListener("reading", onReading);
            reader.removeEventListener("readingerror", onError);
          }
        };

        const onError = () => {
          setStatus("err", "Lesefehler. Bitte erneut versuchen.");
          reader.removeEventListener("reading", onReading);
          reader.removeEventListener("readingerror", onError);
        };

        reader.addEventListener("reading", onReading, { once: true });
        reader.addEventListener("readingerror", onError, { once: true });
      }catch(err){
        setStatus("err", `NFC Lesen fehlgeschlagen: ${err && err.message ? err.message : String(err)}`);
      }
    }

    async function nfcWrite(text){
      if (!hasWebNfc()){ setStatus("err", "Web NFC ist in diesem Browser nicht verfügbar."); return; }
      if (!isSecureContextOk()){ setStatus("err", "Web NFC erfordert HTTPS (oder localhost)."); return; }

      const payload = (text || "").trim();
      if (!payload){ setStatus("err", "Kein Text zum Schreiben vorhanden."); return; }

      try{
        const writer = new NDEFReader();
        setStatus("warn", "Bereit zum Schreiben… halte den NFC-Tag an dein Gerät.");
        await writer.write({ records: [{ recordType: "text", data: payload, lang: "de" }] });
        setStatus("ok", "Pokal erfolgreich aktualisiert.");
      }catch(err){
        setStatus("err", `NFC Schreiben fehlgeschlagen: ${err && err.message ? err.message : String(err)}`);
      }
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }

    if (els.btnRead) els.btnRead.addEventListener("click", readInputManual);
    els.btnNfcRead.addEventListener("click", nfcReadOnce);
    els.btnNfcWrite.addEventListener("click", () => nfcWrite(els.exportText.value));
    els.btnAddMember.addEventListener("click", addMember);
    els.btnAddWinner.addEventListener("click", addWinner);

    els.btnToggleHistory.addEventListener("click", () => {
      els.historyWrap.classList.toggle("hide");
      updateMenuButtonLabels();
    });

    els.btnToggleMembers.addEventListener("click", () => {
      els.membersWrap.classList.toggle("hide");
      updateMenuButtonLabels();
      if (!els.membersWrap.classList.contains("hide")) renderMembersTable();
    });

    els.btnToggleTournament.addEventListener("click", () => {
      const isHidden = els.tournamentWrap.classList.contains("hide");
      els.tournamentWrap.classList.toggle("hide");
      els.btnToggleTournament.textContent = isHidden ? "Turnier ausblenden" : "Neues Turnier erfassen";
    });

    els.btnCopy.addEventListener("click", copyExportToClipboard);

    (function init(){
      renderHeader();
      updateTopPanels();
      els.memJoin.value = todayISO();
      els.datePick.value = todayISO();
      setStatus(null, "Tippe auf „Pokal auslesen“ und halte den NFC-Tag an dein Gerät.");
      updateMenuButtonLabels();
    })();
  </script>
</body>
</html>
